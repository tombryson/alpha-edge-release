# Separate read-only frontend. Choose your own app; do not configure secrets.
app = ""
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_API_URL = "/api/terminal"

[env]
  APP_ACCESS_MODE = "demo"
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/terminal/portfolio"

[[vm]]
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
