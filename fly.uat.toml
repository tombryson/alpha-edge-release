# Use a separate frontend app and origin for your test environment.
app = ""
primary_region = "syd"

[build.args]
  NEXT_PUBLIC_API_URL = "/api/terminal"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  APP_ACCESS_MODE = "owner"
  APP_ORIGIN = ""
  TRADING_BACKEND_API_URL = ""

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
