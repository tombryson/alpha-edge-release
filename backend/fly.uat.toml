# Separate backend and volume for your test environment.
app = ""
primary_region = "syd"

[env]
  PORT = "8081"
  PRIMARY_REGION = "syd"
  DB_PATH = "/litefs/trading.db"
  DB_BACKUP_DIR = "/data/backups"
  APP_ACCESS_MODE = "owner"
  APP_ORIGIN = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[mounts]]
  source = "trading_uat_db"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
